<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscription &amp; BNPL Tracker</title>
    <meta
      name="description"
      content="See the true annual cost of your subscriptions and buy-now-pay-later plans, and catch renewals before they slip past you."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Applies theme, accent, density and motion before first paint. Without
      it, a dark-mode user sees a white flash on every load while React
      boots and reads their preference. Mirrors src/lib/appearance.jsx —
      keep the storage keys in step.
    -->
    <script>
      (function () {
        var root = document.documentElement
        try {
          var get = function (k) { return localStorage.getItem('bnpl-tracker:' + k) }
          var theme = get('theme') || 'system'
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) root.classList.add('dark')
          root.dataset.accent = get('accent') || 'cobalt'
          root.dataset.density = get('density') || 'spacious'
          var motion = get('reduce-motion')
          root.dataset.reduceMotion = motion !== null ? motion : String(matchMedia('(prefers-reduced-motion: reduce)').matches)
        } catch (e) {
          root.dataset.accent = 'cobalt'
        }
      })()
    </script>
  </head>
  <body class="bg-surface-page">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
